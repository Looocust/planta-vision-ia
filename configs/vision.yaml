# Configuración del modelo productivo de visión (Reto 2). Sin secretos.
# La receta productiva (clasificador, PCA, procedimiento de umbrales y de k) está CONGELADA en
# src/vision/recipe.py (RECIPE); los campos classifier/n_pca/k_angle_refine de abajo son solo informativos.
# scripts/train_vision.py usa de aquí: version y angle_tolerance_deg.
version: vision-1.0.2
seed: 42
classifier:
  name: logreg
  params: {C: 1.0}
n_pca: 150
k_angle_refine: 2
target_error_among_act: 0.02   # error máximo tolerado entre decisiones ACT (en validación)
angle_tolerance_deg: 10.0       # tolerancia de agarre del robot (±10°)
feature_config: {}              # vacío → FeatureConfig() por defecto (ver src/vision/features.py)
